# Continuous integration for CareDeploy.
#
# STATUS: first remote run failed (Next route types were missing on a clean checkout); fixed in
# commit 8111064, after which all six jobs passed on GitHub. See docs/verification-matrix.md.
#
# Everything uses throwaway credentials. No job reaches LiveKit, OpenAI or any paid service. Live
# voice tests are manual (docs/live-voice-test-plan.md) and are deliberately not part of CI.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Service credentials are throwaway values for the ephemeral CI database only.
  PG_USER: caredeploy
  PG_PASSWORD: caredeploy
  PG_DB: caredeploy

jobs:
  api-static:
    name: Backend lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy

  api-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caredeploy
          POSTGRES_PASSWORD: caredeploy
          POSTGRES_DB: caredeploy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caredeploy -d caredeploy"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults: { run: { working-directory: apps/api } }
    env:
      DATABASE_URL: postgresql+asyncpg://caredeploy:caredeploy@localhost:5432/caredeploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      # The evaluation engine imports the voice-agent tool layer from source (pytest pythonpath);
      # that layer needs only pydantic and httpx, which the API already depends on.
      - run: pip install -e ".[dev]"
      # The suite creates and drops its own databases (caredeploy_test and scratch evaluation DBs).
      # It runs strictly sequentially: never point two pytest processes at one database.
      - run: pytest -q --junitxml=test-results/backend.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: apps/api/test-results/
          if-no-files-found: ignore
          retention-days: 7

  migration-smoke:
    name: Migration smoke (up, down, up)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caredeploy
          POSTGRES_PASSWORD: caredeploy
          POSTGRES_DB: caredeploy_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caredeploy -d caredeploy_migrations"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults: { run: { working-directory: apps/api } }
    env:
      DATABASE_URL: postgresql+asyncpg://caredeploy:caredeploy@localhost:5432/caredeploy_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - name: Seed the sample clinics
        run: python -m app.seed

  voice-service:
    name: Voice service tests (no audio, no providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: services/voice-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/voice-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy voice_agent
      - run: pytest -q

  web:
    name: Frontend lint, types, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check
      - run: npm run build

  e2e:
    name: Playwright end to end
    runs-on: ubuntu-24.04
    needs: [api-static, web]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caredeploy
          POSTGRES_PASSWORD: caredeploy
          POSTGRES_DB: caredeploy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caredeploy -d caredeploy"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://caredeploy:caredeploy@localhost:5432/caredeploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Playwright starts the API from apps/api/.venv and recreates its own caredeploy_e2e database.
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
        working-directory: apps/api
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
