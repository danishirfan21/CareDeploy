name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: caredeploy, POSTGRES_PASSWORD: caredeploy, POSTGRES_DB: caredeploy }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caredeploy" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    env:
      DATABASE_URL: postgresql+asyncpg://caredeploy:caredeploy@localhost:5432/caredeploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: alembic upgrade head
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: caredeploy, POSTGRES_PASSWORD: caredeploy, POSTGRES_DB: caredeploy }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caredeploy" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://caredeploy:caredeploy@localhost:5432/caredeploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install -e ".[dev]" && alembic upgrade head
        working-directory: apps/api
      - run: nohup uvicorn app.main:app --port 8000 &
        working-directory: apps/api
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
