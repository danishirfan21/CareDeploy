  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Open menu" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" type="button"><span class="material-symbols-outlined">menu</span></button><span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">CareDeploy</span><div class="w-11 h-11 flex items-center justify-end"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-margin pt-14 pb-24 bg-surface min-h-screen"><div class="flex flex-col w-full">
<div class="flex flex-col items-center justify-center w-full px-space-sm pt-space-2xl pb-space-xl">
<div class="flex flex-col items-center text-center max-w-md w-full mt-space-xl mb-space-xl">
<div class="w-12 h-12 rounded-xl bg-primary-fixed text-on-primary-fixed flex items-center justify-center mb-space-lg shadow-sm">
<span class="material-symbols-outlined text-[24px]">terminal</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-space-sm">
        What would you like to do?
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
        Set up a clinic, test an agent, or review recent activity.
      </p>
</div>
<div class="w-full max-w-md flex flex-col gap-space-md">
<div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-space-md flex flex-col gap-space-sm transition-shadow duration-150">
<textarea class="w-full bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md resize-none focus:outline-none leading-relaxed" id="workspace-prompt" placeholder="Describe what you'd like to work on..." rows="3"></textarea>
<div class="flex items-center justify-between pt-space-xs">
<div class="flex items-center gap-space-xs text-on-surface-variant">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-mono text-label-mono">prod-us-east</span>
</div>
<button aria-label="Send prompt" class="w-9 h-9 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center transition-all duration-150 disabled:opacity-60" disabled="" id="send-prompt-btn" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_upward</span>
</button>
</div>
</div>
<div class="flex flex-wrap items-center justify-center gap-space-sm pt-space-xs">
<button class="action-chip flex items-center gap-space-xs px-space-md py-space-sm rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors duration-150" data-prompt="Set up a new clinic environment with intake routing and EHR sync" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">domain_add</span>
<span>Set up a clinic</span>
</button>
<button class="action-chip flex items-center gap-space-xs px-space-md py-space-sm rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors duration-150" data-prompt="Test a voice agent for patient appointment scheduling" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">graphic_eq</span>
<span>Test a voice agent</span>
</button>
<button class="action-chip flex items-center gap-space-xs px-space-md py-space-sm rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors duration-150" data-prompt="Run evaluations on the latest triage agent deployment" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">checklist</span>
<span>Run evaluations</span>
</button>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const textarea = document.getElementById('workspace-prompt');
    const sendBtn = document.getElementById('send-prompt-btn');
    const chips = document.querySelectorAll('.action-chip');

    function updateSendState() {
      const hasText = textarea.value.trim().length > 0;
      sendBtn.disabled = !hasText;
      if (hasText) {
        sendBtn.classList.remove('bg-surface-container', 'text-on-surface-variant');
        sendBtn.classList.add('bg-primary', 'text-on-primary');
      } else {
        sendBtn.classList.remove('bg-primary', 'text-on-primary');
        sendBtn.classList.add('bg-surface-container', 'text-on-surface-variant');
      }
    }

    textarea.addEventListener('input', updateSendState);

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        textarea.value = chip.getAttribute('data-prompt') || '';
        updateSendState();
        textarea.focus();
      });
    });

    sendBtn.addEventListener('click', () => {
      if (!textarea.value.trim()) return;
      sendBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>';
      setTimeout(() => {
        textarea.value = '';
        sendBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">arrow_upward</span>';
        updateSendState();
      }, 600);
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-16 px-margin"><a class="flex flex-col items-center justify-center gap-space-xs min-w-[64px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="clinics" href="#"><span class="material-symbols-outlined text-[22px]">domain</span><span class="font-label-md text-label-md">Clinics</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs min-w-[64px] h-12 transition-colors text-primary" data-path="playground" href="#"><span class="material-symbols-outlined text-[22px]">terminal</span><span class="font-label-md text-label-md">Playground</span></a><a class="flex flex-col items-center justify-center gap-space-xs min-w-[64px] h-12 text-on-surface-variant hover:text-on-surface transition-colors" data-path="activity" href="#"><span class="material-symbols-outlined text-[22px]">timeline</span><span class="font-label-md text-label-md">Activity</span></a></div></nav></body></html>
