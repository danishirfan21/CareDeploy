<h1 class="font-headline-xl text-headline-xl text-on-surface text-center tracking-tight mb-space-xs font-semibold">

<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-md mb-space-2xl">
      Set up a clinic, test an agent, or review recent activity.
    </p>
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-200 p-space-md flex flex-col justify-between min-h-[148px]">
<textarea class="w-full bg-transparent resize-none outline-none font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 p-space-xs" id="taskInput" placeholder="Describe what you'd like to work on..." rows="3"></textarea>
<div class="flex items-center justify-between pt-space-sm mt-space-xs">
<div class="flex items-center gap-space-xs px-space-sm py-1 rounded-full bg-surface-container-low">

</button>

<div class="grid grid-cols-1 sm:grid-cols-3 gap-space-sm w-full mt-space-lg">
<button class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors text-left group" onclick="fillPrompt('Set up a new clinical deployment for pediatric care')">

<span class="material-symbols-outlined text-[18px]">apartment</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Set up a clinic</span>
<span class="font-label-mono text-label-mono text-outline">Provider onboarding</span>
</div>
</button>
<button class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors text-left group" onclick="fillPrompt('Run conversational latency and triage tests on the voice intake agent')">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">graphic_eq</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Test a voice agent</span>
<span class="font-label-mono text-label-mono text-outline">Realtime synthesis</span>
</div>
</button>
<button class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors text-left group" onclick="fillPrompt('Trigger benchmark evaluations against HIPAA compliance dataset v4.1')">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">

</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Run evaluations</span>
<span class="font-label-mono text-label-mono text-outline">Accuracy checks</span>
</div>
</button>
</div>
<div class="mt-space-2xl pt-space-xl flex items-center justify-center gap-space-md text-outline">

<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Audit Trail</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Safety Rules</a>
</div>
</div>
<script>
    const taskInput = document.getElementById('taskInput');
    const submitBtn = document.getElementById('submitBtn');

    function fillPrompt(text) {
      if (!taskInput) return;
      taskInput.value = text;
      taskInput.focus();
      updateButtonState();
    }

    function updateButtonState() {
      if (taskInput.value.trim().length > 0) {
        submitBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
        submitBtn.classList.add('bg-primary', 'text-on-primary');
      } else {
        submitBtn.classList.remove('bg-primary', 'text-on-primary');
        submitBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant');
      }
    }

    taskInput?.addEventListener('input', updateButtonState);
  </script>
