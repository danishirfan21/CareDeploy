[project]
name = "caredeploy-api"
version = "0.1.0"
description = "CareDeploy backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165,<1",
  "uvicorn[standard]>=0.54,<1",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32,<1",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.20,<2",
  "pydantic-settings>=2.16,<3",
   "livekit-api>=1.2.2,<2",
  "tzdata>=2025.1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.5,<2",
  "httpx>=0.28,<1",
  "ruff>=0.17",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true
files = ["app", "tests"]
mypy_path = "../../services/voice-agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["../../services/voice-agent"]
markers = ["db: requires a reachable PostgreSQL instance"]
