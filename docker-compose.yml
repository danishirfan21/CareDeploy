services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: caredeploy
      POSTGRES_PASSWORD: caredeploy
      POSTGRES_DB: caredeploy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredeploy -d caredeploy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
