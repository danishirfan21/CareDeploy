[project]
name = "caredeploy-voice-agent"
version = "0.3.0"
description = "CareDeploy real-time voice agent (LiveKit Agents worker)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "tzdata>=2024.1",
  "livekit-agents==1.8.13",
  "livekit-plugins-openai>=1.8,<2",
  "livekit-plugins-silero>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["voice_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
